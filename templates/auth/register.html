{% extends "base.html" %}
{% block title %}Register - CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-3 fw-bold">Create Student Account</h4>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name (Printed on Certificates)</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g., Riya Sharma" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">College Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="riya@campusconnect.edu" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password (min. 6 characters)</label>
                        <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold">Create Account</button>
                </form>
                <p class="text-center small text-muted mt-3 mb-0">
                    Already registered? <a href="{{ url_for('auth.login') }}">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
