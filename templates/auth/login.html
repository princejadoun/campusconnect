{% extends "base.html" %}
{% block title %}Login - CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-3 fw-bold">Sign In to CampusConnect</h4>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">College Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@campusconnect.edu" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold">Login</button>
                </form>

                <div class="alert alert-light border mt-3 mb-0 small">
                    <strong>Demo Accounts:</strong><br>
                    Admin: <code>admin@campusconnect.edu</code> / <code>admin123</code><br>
                    Student: <code>aarav@campusconnect.edu</code> / <code>student123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
